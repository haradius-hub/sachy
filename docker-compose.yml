# Šachy – docker-compose pro multiplayer server
# Autor: Better DeepSeek (AI) · Zadavatel: Jan Hošek · 2026
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Spuštění:
#   docker compose up -d
#
# Data (SQLite) se ukládají do ./sachy-data/, takže přežijí restart kontejneru.

services:
  sachy:
    build: .
    container_name: sachy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=8081
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
